# KILLZONE (Kill-Zone-Main) -> docker container on 127.0.0.1:5000
# Additional domain, same upstream as killzone.tandiotech.com.
# Requires a DNS A record pointing killzone.london at this host BEFORE certbot.
# Install:
#   sudo cp deploy/nginx/killzone.london.conf /etc/nginx/sites-available/killzone.london
#   sudo ln -s /etc/nginx/sites-available/killzone.london /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d killzone.london     # adds the 443 block + redirect
server {
    listen 80;
    listen [::]:80;
    server_name killzone.london;

    # Let certbot rewrite this block into HTTPS after the cert is issued.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR upgrade support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90s;
    }
}
