services:
  killzone:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5000:5000"
    # Runtime secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, APP_AUTH_SECRET,
    # NEWS_API_KEY, PUBLIC_APP_URL) come from a local .env, never baked into the image.
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5000}
